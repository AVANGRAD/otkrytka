<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(circle at top, #ffe6ef, #f7a9c4 55%, #e875a0);
    color: #8f234d;
  }
  .card {
    position: relative; z-index: 2; width: min(88vw, 520px);
    padding: 58px 28px; text-align: center;
    background: rgba(255,255,255,.78);
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(125, 25, 70, .2);
    animation: appear 1.1s ease both;
  }
  .small { font: 600 13px Arial, sans-serif; letter-spacing: 4px; text-transform: uppercase; color: #c05a80; }
  h1 { margin: 22px 0 12px; font-size: clamp(38px, 9vw, 64px); line-height: 1.05; }
  .heart { display: inline-block; color: #e54478; animation: pulse 1.2s infinite; }
  p { margin: 18px auto 0; max-width: 340px; font: 17px/1.6 Arial, sans-serif; color: #9b5270; }
  .signature { margin-top: 28px; font-style: italic; font-size: 19px; color: #c04e7a; }
  .floating { position: absolute; bottom: -50px; color: rgba(255,255,255,.8); animation: floatUp linear infinite; z-index: 1; }
  @keyframes pulse { 50% { transform: scale(1.22); } }
  @keyframes appear { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes floatUp { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>
  <main class="card">
    <div class="small">Открытка для тебя</div>
    <h1>Я тебя<br>люблю <span class="heart">♥</span></h1>
    <p>Ты делаешь мой мир ярче. Спасибо, что ты есть в моей жизни. ❤️</p>
    <div class="signature">От всего сердца 💌</div>
  </main>
<script>
  const symbols = ["♥", "♡", "✿"];
  for (let i = 0; i < 24; i++) {
    const el = document.createElement("div");
    el.className = "floating";
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (16 + Math.random() * 24) + "px";
    el.style.animationDuration = (7 + Math.random() * 9) + "s";
    el.style.animationDelay = (-Math.random() * 12) + "s";
    document.body.appendChild(el);
  }
</script>
</body>
</html>
